<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – News, Wetter & Kino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f1218;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
    }
    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: #1a1e26;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #2a2f3a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2a2f3a;
    }
    .card-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0c040;
      letter-spacing: 0.5px;
    }
    .card-header .icon { font-size: 1.3rem; }
    .full-width { grid-column: 1 / -1; }

    .clock-section {
      text-align: center;
      padding: 32px 24px;
    }
    .clock-section .time {
      font-size: 4.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #fff;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .clock-section .date {
      font-size: 1rem;
      color: #888;
      margin-top: 6px;
      letter-spacing: 2px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .news-list::-webkit-scrollbar { width: 4px; }
    .news-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .news-item {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      background: #141820;
      border-radius: 10px;
      transition: background 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .news-item:hover { background: #1e2330; }
    .news-img {
      width: 80px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: #2a2f3a;
      flex-shrink: 0;
    }
    .news-content { flex: 1; min-width: 0; }
    .news-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: #e8e8e8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }
    .news-source {
      font-size: 0.7rem;
      color: #f0c040;
      margin-top: 2px;
    }
    .news-date {
      font-size: 0.72rem;
      color: #666;
      margin-top: 2px;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .weather-city {
      background: #141820;
      border-radius: 12px;
      padding: 18px;
    }
    .weather-city h3 {
      font-size: 0.9rem;
      color: #f0c040;
      margin-bottom: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .weather-days {
      display: flex;
      gap: 8px;
    }
    .weather-day {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      background: #1a1e26;
      border-radius: 8px;
    }
    .weather-day .day-name {
      font-size: 0.72rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .weather-day .temp {
      font-size: 1rem;
      font-weight: 600;
    }
    .weather-day .temp-range {
      font-size: 0.72rem;
      color: #666;
      margin-top: 2px;
    }
    .weather-day .precip {
      font-size: 0.72rem;
      color: #5b9bd5;
      margin-top: 4px;
    }
    .weather-current {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .weather-current .temp-now {
      font-size: 2.2rem;
      font-weight: 300;
      color: #fff;
    }
    .weather-current .desc {
      font-size: 0.85rem;
      color: #888;
    }

    .kino-scroll {
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .kino-scroll::-webkit-scrollbar { width: 4px; }
    .kino-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .kino-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .kino-item {
      padding: 14px 16px;
      background: #141820;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .kino-item:hover { background: #1e2330; }
    .kino-item .movie-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e8e8e8;
    }
    .kino-item .movie-meta {
      font-size: 0.75rem;
      color: #666;
      margin-top: 4px;
    }
    .kino-item .movie-cinemas {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .kino-item .movie-cinemas span {
      font-size: 0.7rem;
      padding: 3px 8px;
      background: #1a1e26;
      border-radius: 4px;
      color: #999;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      color: #555;
      font-size: 0.9rem;
    }
    .error-box {
      text-align: center;
      padding: 30px 0;
    }
    .error-box .msg {
      color: #e74c3c;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .error-box a {
      color: #5b9bd5;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .error-box a:hover { text-decoration: underline; }
    .btn-link {
      display: inline-block;
      padding: 10px 24px;
      border: 1px solid #5b9bd5;
      border-radius: 8px;
      color: #5b9bd5;
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn-link:hover {
      background: #5b9bd5;
      color: #fff;
    }

    @media (max-width: 900px) {
      .dashboard { grid-template-columns: 1fr; }
      .weather-grid { grid-template-columns: 1fr; }
      .clock-section .time { font-size: 3rem; }
    }
    @media (max-width: 500px) {
      body { padding: 12px; }
      .card { padding: 16px; }
      .news-item { flex-direction: column; }
      .news-img { width: 100%; height: 120px; }
      .clock-section .time { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

<div class="dashboard">

  <!-- UHRZEIT -->
  <div class="card full-width clock-section">
    <div class="time" id="clock">--:--:--</div>
    <div class="date" id="date">--</div>
  </div>

  <!-- TAGESSCHAU NEWS -->
  <div class="card">
    <div class="card-header">
      <span class="icon">📰</span>
      <h2>Tagesschau – Aktuelle Nachrichten</h2>
    </div>
    <div id="newsContainer">
      <div class="loading">Nachrichten werden geladen...</div>
    </div>
  </div>

  <!-- WETTER -->
  <div class="card">
    <div class="card-header">
      <span class="icon">🌤</span>
      <h2>Wetter – 3-Tage-Vorhersage</h2>
    </div>
    <div id="weatherContainer">
      <div class="loading">Wetterdaten werden geladen...</div>
    </div>
  </div>

  <!-- KINOPROGRAMM BERLIN -->
  <div class="card full-width">
    <div class="card-header">
      <span class="icon">🎬</span>
      <h2>Kinoprogramm Berlin</h2>
    </div>
    <div id="kinoContainer">
      <div class="loading">Kinoprogramm wird geladen...</div>
    </div>
  </div>

</div>

<script>
  // ===== UHRZEIT =====
  (function initClock() {
    function update() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('date').textContent =
        now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    update();
    setInterval(update, 1000);
  })();

  // ===== TAGESSCHAU NEWS via RSS2JSON =====
  (async function loadNews() {
    const container = document.getElementById('newsContainer');
    try {
      const res = await fetch(
        'https://api.rss2json.com/v1/api.json?rss_url=https://www.tagesschau.de/xml/rss2'
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.status !== 'ok' || !data.items || !data.items.length) {
        throw new Error('Keine Nachrichten gefunden');
      }

      let html = '<div class="news-list">';
      const formatter = new Intl.DateTimeFormat('de-DE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      data.items.slice(0, 15).forEach(item => {
        const title = item.title || 'Ohne Titel';
        const pubDate = item.pubDate ? formatter.format(new Date(item.pubDate)) : '';
        const link = item.link || '#';
        const desc = item.description || '';
        const imgMatch = desc.match(/<img[^>]+src="([^"]+)"/);
        const imgUrl = imgMatch ? imgMatch[1].replace(/^\/\//, 'https://') : item.thumbnail || '';
        const img = imgUrl ? `<img class="news-img" src="${imgUrl}" alt="" loading="lazy">` : '<div class="news-img"></div>';
        html += `<a class="news-item" href="${link}" target="_blank" rel="noopener">${img}<div class="news-content"><div class="news-title">${title}</div><div class="news-source">tagesschau.de</div><div class="news-date">${pubDate}</div></div></a>`;
      });
      html += '</div>';
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = `<div class="error-box"><div class="msg">${err.message}</div></div>`;
    }
  })();

  // ===== WETTER (Open-Meteo) =====
  (async function loadWeather() {
    const container = document.getElementById('weatherContainer');
    try {
      const cities = [
        { lat: 48.0497, lon: 9.3284, name: '88512 Mengen' },
        { lat: 52.52, lon: 13.405, name: 'Berlin' }
      ];
      const params = 'current=temperature_2m,precipitation,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Europe/Berlin&forecast_days=3';

      const results = await Promise.all(cities.map(async city => {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&${params}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${city.name}: HTTP ${res.status}`);
        const d = await res.json();
        return { city: city.name, data: d };
      }));

      const dayNames = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
      const wmoIcons = {
        0: '☀️', 1: '🌤', 2: '⛅', 3: '☁️', 45: '🌫', 48: '🌫',
        51: '🌦', 53: '🌦', 55: '🌦', 56: '🌦', 57: '🌦',
        61: '🌧', 63: '🌧', 65: '🌧', 66: '🌧', 67: '🌧',
        71: '🌨', 73: '🌨', 75: '🌨', 77: '🌨',
        80: '🌦', 81: '🌦', 82: '🌦', 85: '🌨', 86: '🌨',
        95: '⛈', 96: '⛈', 99: '⛈'
      };

      let html = '<div class="weather-grid">';
      results.forEach(r => {
        const c = r.data;
        const cur = c.current;
        const daily = c.daily;
        const icon = wmoIcons[cur?.weather_code] || '🌤';
        const t = cur?.temperature_2m != null ? Math.round(cur.temperature_2m) + '°C' : '--';
        const p = cur?.precipitation != null ? cur.precipitation : 0;

        html += `<div class="weather-city"><h3>${r.city}</h3>`;
        html += `<div class="weather-current"><span style="font-size:2rem">${icon}</span><span class="temp-now">${t}</span><span class="desc">Niederschlag: ${p} mm</span></div>`;
        html += '<div class="weather-days">';
        if (daily) {
          for (let i = 0; i < 3; i++) {
            const d = new Date(daily.time[i] + 'T12:00:00');
            const max = daily.temperature_2m_max[i] != null ? Math.round(daily.temperature_2m_max[i]) + '°' : '--';
            const min = daily.temperature_2m_min[i] != null ? Math.round(daily.temperature_2m_min[i]) + '°' : '--';
            const pr = daily.precipitation_sum[i] != null ? daily.precipitation_sum[i] : 0;
            html += `<div class="weather-day"><div class="day-name">${dayNames[d.getDay()]}</div><div class="temp">${max}</div><div class="temp-range">${min} / ${max}</div><div class="precip">💧 ${pr} mm</div></div>`;
          }
        }
        html += '</div></div>';
      });
      html += '</div>';
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = `<div class="error-box"><div class="msg">Fehler: ${err.message}</div></div>`;
    }
  })();

  // ===== KINOPROGRAMM BERLIN =====
  (async function loadKino() {
    const container = document.getElementById('kinoContainer');

    // Versuche, Filme via CORS-Proxy von cinema.de zu scrapen
    const proxies = [
      'https://api.allorigins.win/raw?url=',
      'https://api.allorigins.win/get?url='
    ];

    const cinemaUrls = [
      'https://www.cinema.de/kino/kinoprogramm/berlin',
      'https://www.berlin.de/kino/_bin/index.php'
    ];

    let movies = null;

    for (const proxy of proxies) {
      if (movies) break;
      for (const url of cinemaUrls) {
        try {
          const res = await fetch(proxy + encodeURIComponent(url), { signal: AbortSignal.timeout(8000) });
          if (!res.ok) continue;
          let text;
          try {
            const json = await res.json();
            text = json.contents || json.body || JSON.stringify(json);
          } catch {
            text = await res.text();
          }

          // Extrahiere Filmtitel – verschiedene Patterns
          const extracted = new Set();
          const patterns = [
            /<h2[^>]*class="[^"]*title[^"]*"[^>]*>([^<]+)<\/h2>/gi,
            /<h3[^>]*class="[^"]*title[^"]*"[^>]*>([^<]+)<\/h3>/gi,
            /<a[^>]*class="[^"]*movie-title[^"]*"[^>]*>([^<]+)<\/a>/gi,
            /<span[^>]*class="[^"]*title[^"]*"[^>]*>([^<]+)<\/span>/gi,
            /alt="([^"]*)"[^>]*class="[^"]*(?:movie|film|poster)[^"]*"/gi,
            /<h2[^>]*>([^<]{3,80})<\/h2>/g,
            /<h3[^>]*>([^<]{3,80})<\/h3>/g
          ];

          patterns.forEach(pat => {
            let m;
            while ((m = pat.exec(text)) !== null) {
              const t = m[1].trim().replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
              if (t.length > 2 && t.length < 80 && !/^\s*$/.test(t) && !t.includes('Sie such') && !t.includes('Fehler') && !t.includes('Cookie') && !t.includes('Datenschutz') && !t.includes('Menü') && !t.includes('Navigation')) {
                extracted.add(t);
              }
            }
          });

          if (extracted.size >= 5) {
            movies = [...extracted].slice(0, 24);
            break;
          }
        } catch (e) {
          continue;
        }
      }
    }

    if (movies && movies.length >= 5) {
      let html = '<div class="kino-scroll"><div class="kino-list">';
      movies.forEach(title => {
        html += `<div class="kino-item"><div class="movie-title">${title}</div><div class="movie-meta">Berlin</div></div>`;
      });
      html += `</div></div>
        <div style="margin-top:14px;text-align:center">
          <a class="btn-link" href="https://www.cinema.de/kino/kinoprogramm/berlin" target="_blank" rel="noopener">→ Vollständiges Programm auf cinema.de</a>
        </div>`;
      container.innerHTML = html;
    } else {
      container.innerHTML = `
        <div class="error-box">
          <div class="msg">Kinoprogramm konnte nicht automatisch geladen werden.</div>
          <a class="btn-link" href="https://www.cinema.de/kino/kinoprogramm/berlin" target="_blank" rel="noopener">→ Programm auf cinema.de ansehen</a>
          <div style="margin-top:10px">
            <a class="btn-link" href="https://www.berlin.de/kino/" target="_blank" rel="noopener">→ Programm auf Berlin.de</a>
          </div>
          <div style="margin-top:10px">
            <a class="btn-link" href="https://www.tip-berlin.de/kinoprogramm/" target="_blank" rel="noopener">→ Programm auf tip-berlin.de</a>
          </div>
        </div>`;
    }
  })();
</script>

</body>
</html>
